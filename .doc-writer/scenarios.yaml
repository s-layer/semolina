version: 1
# Regenerated 2026-10-26 for the 0.9.0 documentation gate: two pages were added since the
# 2026-09-05 set (how-to/query-by-name.rst, changelog/index.rst), so the reuse rule did not
# apply. Each persona keeps one core-path scenario from the previous set and adds scenarios
# for the 0.9.0 surface (query by name, time grains, field metadata, codegen --check).
user_personas:
  - name: "Data engineers exposing semantic layers via APIs"
    skill_level: "intermediate"
    generated_at: "2026-10-26"
    doc_pages:
      - "changelog/index.rst"
      - "explanation/duckdb-vs-warehouse.rst"
      - "explanation/index.rst"
      - "explanation/semantic-views.rst"
      - "explanation/type-fidelity.rst"
      - "how-to/backends.rst"
      - "how-to/codegen-credentials.rst"
      - "how-to/codegen.rst"
      - "how-to/connection-pools.rst"
      - "how-to/dto-codegen.rst"
      - "how-to/filtering.rst"
      - "how-to/index.rst"
      - "how-to/models.rst"
      - "how-to/queries.rst"
      - "how-to/query-by-name.rst"
      - "how-to/streaming.rst"
      - "how-to/typed-results.rst"
      - "how-to/warehouse-testing.rst"
      - "how-to/web-api.rst"
      - "index.rst"
      - "reference/cli.rst"
      - "reference/config.rst"
      - "reference/index.rst"
      - "tutorials/dashboard-api.rst"
      - "tutorials/first-query.rst"
      - "tutorials/index.rst"
      - "tutorials/installation.rst"
      - "tutorials/shaping-a-report.rst"
      - "tutorials/testing-queries.rst"
      - "tutorials/warehouse-models.rst"
    scenarios:
      - id: S1
        goal: "I want to run semolina codegen against my Snowflake semantic views, which dbt-s-layer has tagged, and get models that carry each member's label, description, synonyms and format, and know what my role needs to be allowed to read"
        starting_point: "docs/src/index.rst"
        persona_relevance: "I own the semantic layer and already annotate it through dbt-s-layer. The point of generating models is that the annotations I maintain in the warehouse reach the frontend team's code without anyone retyping them."
        done_when: "I know which warehouse metadata becomes which model argument on Snowflake, what the generated field looks like, what grants the codegen role needs for the tag lookup, and what error I get if it lacks them."
      - id: S2
        goal: "I want codegen --check in CI to fail when a description, synonym or tag changes in the warehouse, and I want to know why my existing models started failing after upgrading"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Drift between the warehouse and committed models is exactly what I am trying to prevent. An upgrade that turns CI red with no explanation would cost me a day."
        done_when: "I know which metadata --check compares on each backend, how a metadata difference is printed, which exit code a CI job sees, and the one-time step that clears drift on models generated by an earlier release."
      - id: S3
        goal: "I run Databricks only. I want generated models to pick up my metric view's display names, comments, synonyms and S_LAYER column tags, and to know the Databricks-specific limits"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Our platform is Databricks. I need a Databricks story for the new metadata without reading Snowflake material."
        done_when: "I know where each Databricks field property lands in the model, what access the tag lookup needs in Unity Catalog, and how far --check is trusted on Databricks."
      - id: S4
        goal: "I develop locally on DuckDB with the semolina[duckdb] extra and want to know which of the new features (metadata in codegen, time grains) work there before I promise them to the frontend team"
        starting_point: "docs/src/index.rst"
        persona_relevance: "DuckDB is my local stand-in for the warehouse. A feature that silently differs locally makes my tests lie."
        done_when: "I know which metadata codegen reads on DuckDB, whether a time grain query runs with the DuckDB version the extra installs, and what I can still check locally."
      - id: S5
        goal: "I want to build a query endpoint that takes a filter from the frontend's query string and returns metric data as JSON with sane HTTP status codes"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Kept from the previous set: serving the semantic layer to a frontend team is the reason I use the library, and I have never written a REST endpoint."
        done_when: "I have runnable endpoint code covering engine startup/shutdown, an optional filter parameter, and a mapping from failures to HTTP status codes."
  - name: "Python web developers building analytics backends"
    skill_level: "advanced"
    generated_at: "2026-10-26"
    doc_pages:
      - "changelog/index.rst"
      - "explanation/duckdb-vs-warehouse.rst"
      - "explanation/index.rst"
      - "explanation/semantic-views.rst"
      - "explanation/type-fidelity.rst"
      - "how-to/backends.rst"
      - "how-to/codegen-credentials.rst"
      - "how-to/codegen.rst"
      - "how-to/connection-pools.rst"
      - "how-to/dto-codegen.rst"
      - "how-to/filtering.rst"
      - "how-to/index.rst"
      - "how-to/models.rst"
      - "how-to/queries.rst"
      - "how-to/query-by-name.rst"
      - "how-to/streaming.rst"
      - "how-to/typed-results.rst"
      - "how-to/warehouse-testing.rst"
      - "how-to/web-api.rst"
      - "index.rst"
      - "reference/cli.rst"
      - "reference/config.rst"
      - "reference/index.rst"
      - "tutorials/dashboard-api.rst"
      - "tutorials/first-query.rst"
      - "tutorials/index.rst"
      - "tutorials/installation.rst"
      - "tutorials/shaping-a-report.rst"
      - "tutorials/testing-queries.rst"
      - "tutorials/warehouse-models.rst"
    scenarios:
      - id: S1
        goal: "I want to expose one semantic view to an LLM agent as a tool, and to my frontend as a JSON body endpoint, both taking the query as field names, with bad input reported back as a 4xx and a useful message"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Our product now has an assistant that answers dashboard questions. The model can only send JSON, and so can the frontend's query builder, so attribute-based queries are out for this path."
        done_when: "I can build a query from a dict, hand the model a JSON Schema for the tool, catch the right exception and return its message as a client error from a FastAPI handler without misclassifying it as a server error."
      - id: S2
        goal: "I want a weekly revenue chart: revenue grouped by week for a date range, sorted by week, on Snowflake in production and DuckDB in development"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Time series are the most common dashboard widget. Truncation semantics (week start, return type) and date filter behaviour are where hand-written SQL usually goes wrong."
        done_when: "I know the call, the result column name and Python type, where weeks start, how to filter by date safely on Snowflake, and whether it runs on my local DuckDB."
      - id: S3
        goal: "I want my API to return display labels, descriptions and number formats for each metric alongside the data, taken from the model rather than hard-coded in the frontend"
        starting_point: "docs/src/index.rst"
        persona_relevance: "The frontend currently duplicates 'Revenue (USD)' and the currency format by hand. If the model carries them I want to serve them from one place."
        done_when: "I know how to declare the metadata on a model, how to read it back off the model's fields at runtime, and how codegen fills it from the warehouse."
      - id: S4
        goal: "I want to go from nothing to a running FastAPI service that answers GET /revenue with a typed JSON body, and point it at Snowflake via .semolina.toml"
        starting_point: "docs/src/index.rst"
        persona_relevance: "Kept from the previous set: the core path the library exists for."
        done_when: "I can run a FastAPI app that returns JSON from a semantic view, and know which lines change to run it against Snowflake."
