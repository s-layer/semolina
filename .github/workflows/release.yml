name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  # `project.version` in pyproject.toml is static, and nothing used to compare it with the
  # tag being released. A `v0.7.0` tag on a tree still declaring 0.6.0 would build, validate
  # and only then be refused by PyPI as a duplicate — after the changelog job had already
  # run. This gate answers that question first, before anything is built (REL-01).
  version-gate:
    name: Tag matches package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging python - "$TAG_NAME" <<'PYEOF'
          import pathlib
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          raw = sys.argv[1]
          tag = raw.removeprefix("v")
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]

          # Compared as PEP 440 versions, not as strings, so the prerelease tags the trigger
          # allows (v0.7.0-rc1) match the form pyproject carries for them (0.7.0rc1).
          try:
              matches = Version(tag) == Version(declared)
          except InvalidVersion as exc:
              sys.exit(f"::error::Tag {raw!r} is not a PEP 440 version: {exc}")

          if not matches:
              sys.exit(
                  f"::error::Tag {raw!r} declares version {tag!r} but pyproject.toml says "
                  f"{declared!r}. Bump `project.version`, commit, then re-tag."
              )

          print(f"Tag {raw} matches pyproject.toml version {declared}")
          PYEOF

  # Runs the CI workflow against the tagged commit itself. ci.yml ignores tag pushes, so
  # without this a tag could be published having run no tests at all — the tag might sit on
  # a commit CI never saw, or on one whose run was red (REL-02).
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # A called workflow can't be granted more than its caller. ci.yml's test job asks for
    # pull-requests: write (for the PR coverage comment), so without this the whole run
    # fails at startup before any job is scheduled.
    permissions:
      contents: read
      pull-requests: write

  build:
    name: Build distributions
    needs: [version-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No `uv sync` here on purpose: `uv build` resolves its own build backend and needs
      # none of the project's runtime or dev dependencies.
      - name: Build wheel and sdist
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  validate:
    name: Validate distributions
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Test wheel installation
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv venv --python ${{ matrix.python-version }} test-env-wheel
          uv pip install --python test-env-wheel/bin/python dist/*.whl
          # version-gate checked the tag against pyproject.toml; this checks it against what
          # the built artifact actually reports at runtime, closing the gap between the
          # declared version and the installed one.
          #
          # Compared as PEP 440 versions, for the same reason version-gate does. Wheel
          # metadata is canonicalised at build time — a pyproject version of 0.7.0-rc1
          # becomes `Version: 0.7.0rc1` (verified by building one) — so an exact string
          # comparison against the tag would reject every prerelease that version-gate had
          # just deliberately accepted.
          INSTALLED=$(test-env-wheel/bin/python -c "import semolina; print(semolina.__version__)")
          echo "semolina version: $INSTALLED"
          uv run --no-project --with packaging python - "$TAG_NAME" "$INSTALLED" <<'PYEOF'
          import sys

          from packaging.version import Version

          raw, installed = sys.argv[1], sys.argv[2]
          tag = raw.removeprefix("v")
          if Version(tag) != Version(installed):
              sys.exit(f"::error::Wheel reports {installed!r} but tag {raw!r} declares {tag!r}")
          print(f"Wheel version {installed} matches tag {raw}")
          PYEOF
          test-env-wheel/bin/python -c "from semolina import SemanticView, Dimension, Metric, register, Row; print('Public API imports OK')"

      - name: Test sdist installation
        run: |
          uv venv --python ${{ matrix.python-version }} test-env-sdist
          uv pip install --python test-env-sdist/bin/python dist/*.tar.gz
          test-env-sdist/bin/python -c "import semolina; print(f'semolina version: {semolina.__version__}')"

      - name: Check py.typed marker in wheel
        run: |
          unzip -l dist/*.whl | grep "semolina/py.typed" || (echo "ERROR: py.typed marker missing" && exit 1)

      - name: Inspect wheel metadata
        run: |
          unzip -p dist/*.whl "*/METADATA" | head -20

  changelog:
    name: Generate changelog
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -L https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz --strip-components=1 -C /usr/local/bin

      - name: Generate changelog
        run: git-cliff --latest --output CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

  publish:
    name: Publish to PyPI
    needs: [validate, changelog, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/semolina
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: [publish, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: true
