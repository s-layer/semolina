name: DuckDB extension version check

# Weekly watch for a newer `semantic_views` community-extension build.
#
# The `duckdb` dependency is hard-pinned in pyproject.toml because the
# version-locked semantic_views extension only has published binaries for
# specific DuckDB core versions. This job detects when a newer build ships and
# opens a PR moving the pin forward; CI on that PR validates it actually works.
#
# Detection sources (all upstream, no local state):
#   - description.yml -> the extension's own version (PR context)
#   - PyPI's duckdb releases -> the stable versions newer than the pin
#   - HEAD probe of the published binary -> the newest of those the extension is
#     actually built for (a version without a binary yet just defers the bump)
#
# The target used to come from build.yml's DUCKDB_LATEST_STABLE, until upstream
# started setting it to a commit SHA for the DuckDB 2.0 alphas. Probing the
# published binaries answers the question directly: which DuckDB release can
# this extension be loaded into today.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start ci.yml on the bump branch when the PR is opened with GITHUB_TOKEN.
  actions: write

concurrency:
  group: duckdb-extension-check
  cancel-in-progress: false

jobs:
  check:
    name: Check for newer semantic_views build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Detect newer published semantic_views build
        id: detect
        env:
          DESC_URL: https://raw.githubusercontent.com/duckdb/community-extensions/main/extensions/semantic_views/description.yml
          PYPI_URL: https://pypi.org/pypi/duckdb/json
        run: |
          set -euo pipefail

          CURRENT=$(grep -oE 'duckdb==[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml | head -1 | cut -d= -f3 || true)
          [ -n "$CURRENT" ] || { echo "::error::could not read 'duckdb==' pin from pyproject.toml"; exit 1; }
          echo "current pin: $CURRENT"

          desc=$(curl -fsSL "$DESC_URL")
          EXT_VERSION=$(printf '%s\n' "$desc" | grep -E '^[[:space:]]*version:' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          EXT_REF=$(printf '%s\n' "$desc" | grep -E '^[[:space:]]*ref:' | grep -oE '[0-9a-f]{40}' | head -1 || true)
          [ -n "$EXT_VERSION" ] || { echo "::error::could not parse extension version from description.yml"; exit 1; }
          echo "extension version: $EXT_VERSION (ref ${EXT_REF:-unknown})"

          # Stable (X.Y.Z, not yanked) duckdb releases newer than the pin, newest first.
          CANDIDATES=$(curl -fsSL "$PYPI_URL" | CURRENT="$CURRENT" python3 -c '
          import json, os, re, sys
          current = tuple(map(int, os.environ["CURRENT"].split(".")))
          releases = json.load(sys.stdin)["releases"]
          stable = [
              v for v, files in releases.items()
              if re.fullmatch(r"\d+\.\d+\.\d+", v)
              and files and not any(f.get("yanked") for f in files)
              and tuple(map(int, v.split("."))) > current
          ]
          stable.sort(key=lambda v: tuple(map(int, v.split("."))), reverse=True)
          print(" ".join(stable))
          ')
          echo "newer stable duckdb releases: ${CANDIDATES:-none}"

          # The newest candidate with a published binary for every platform we rely
          # on (linux_amd64 = CI, osx_arm64 = local dev). Only a 403/404 means "not
          # published"; any other failure defers the whole bump to the next run, so
          # a CDN blip can't make us fall back to an older release.
          TARGET=""
          PROBE_FAILED=""
          for version in $CANDIDATES; do
            published=true
            for plat in linux_amd64 osx_arm64; do
              url="https://community-extensions.duckdb.org/v${version}/${plat}/semantic_views.duckdb_extension.gz"
              code=$(curl -sI --max-time 20 --retry 2 -o /dev/null -w '%{http_code}' "$url" || true)
              echo "probe $version $plat -> $code"
              case "$code" in
                200) ;;
                403|404) published=false; break ;;
                *) PROBE_FAILED="$version $plat (HTTP $code)"; break 2 ;;
              esac
            done
            if [ "$published" = true ]; then
              TARGET="$version"
              break
            fi
          done

          {
            echo "current=$CURRENT"
            echo "target=${TARGET:-$CURRENT}"
            echo "ext_version=$EXT_VERSION"
            echo "ext_ref=$EXT_REF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$PROBE_FAILED" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Could not probe the semantic_views binary for $PROBE_FAILED. Will retry next run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$TARGET" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            if [ -n "$CANDIDATES" ]; then
              echo "⏳ Newer duckdb releases exist ($CANDIDATES) but semantic_views is not published for them on both platforms yet. Will retry next run." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ Already pinned to the newest stable duckdb (duckdb $CURRENT, semantic_views $EXT_VERSION)." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "⬆️ Newer published build available: duckdb \`$CURRENT\` → \`$TARGET\` (semantic_views \`$EXT_VERSION\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pin bump
        if: steps.detect.outputs.bump == 'true'
        env:
          CURRENT: ${{ steps.detect.outputs.current }}
          TARGET: ${{ steps.detect.outputs.target }}
        run: |
          set -euo pipefail
          sed -i "s/duckdb==${CURRENT}/duckdb==${TARGET}/" pyproject.toml
          grep -q "duckdb==${TARGET}" pyproject.toml || { echo "::error::pin bump did not apply to pyproject.toml"; exit 1; }
          uv lock

      - name: Get app token
        id: app-token
        if: steps.detect.outputs.bump == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Open pull request
        id: cpr
        if: steps.detect.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/bump-duckdb
          delete-branch: true
          commit-message: "chore: bump duckdb pin ${{ steps.detect.outputs.current }} -> ${{ steps.detect.outputs.target }}"
          title: "chore: bump duckdb pin ${{ steps.detect.outputs.current }} → ${{ steps.detect.outputs.target }} (semantic_views v${{ steps.detect.outputs.ext_version }})"
          body: |
            Automated by `.github/workflows/duckdb-extension-check.yml`.

            A `semantic_views` community-extension binary is now published for a
            newer DuckDB core release, so the pin can move forward.

            | | value |
            |---|---|
            | duckdb pin | `${{ steps.detect.outputs.current }}` → `${{ steps.detect.outputs.target }}` |
            | semantic_views version (upstream manifest) | `${{ steps.detect.outputs.ext_version }}` |
            | extension build ref | `${{ steps.detect.outputs.ext_ref }}` |
            | platforms probed | `linux_amd64`, `osx_arm64` (both HTTP 200) |

            The extension version is read from upstream `main`. The binary published
            for this DuckDB release may be an earlier `semantic_views` build.

            Source of truth:
            - extension manifest: https://github.com/duckdb/community-extensions/blob/main/extensions/semantic_views/description.yml
            - duckdb releases: https://pypi.org/project/duckdb/#history

            CI on this PR confirms `INSTALL`/`LOAD semantic_views` works under duckdb
            `${{ steps.detect.outputs.target }}`. When the bot app opened it, CI ran on
            the push as usual; otherwise the workflow started `ci.yml` on the branch
            itself, and the run shows up in this PR's checks.

      # A PR opened with GITHUB_TOKEN triggers no workflows, so without the bot app the
      # bump would sit with no CI at all. A workflow_dispatch is one of the few events that token
      # can start; its run reports on the branch head, which is the PR's head (TEST-03).
      # An unchanged PR ("none") is dispatched too: its earlier run may have been cancelled, or
      # it may predate this step, and nothing else would ever give it CI.
      - name: Start CI on the bump branch
        if: >-
          steps.detect.outputs.bump == 'true'
          && steps.app-token.outputs.token == ''
          && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin chore/bump-duckdb > /dev/null; then
            echo "No chore/bump-duckdb branch, so there is no PR to run CI on."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/bump-duckdb
